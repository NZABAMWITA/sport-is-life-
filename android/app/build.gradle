plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id "com.google.gms.google-services"
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.sport_is_life"
    compileSdk 36 // Updated to specific version for better compatibility

    // NDK version set to match your manually installed NDK
    ndkVersion "27.0.12077973"  // Using numeric version that matches folder name

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        // ADDED: Enable core library desugaring for flutter_local_notifications
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID
        applicationId "com.example.sport_is_life"
        
        // FIXED: Changed from minSdkVersion flutter.minSdkVersion to minSdk 21
        minSdkVersion flutter.minSdkVersion  // Explicitly set to 21
        
        // Keep these as they are
        targetSdk 34
        versionCode flutter.versionCode
        versionName flutter.versionName
        
        // NDK configuration for Agora to handle multiple architectures
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        
        // For better resource handling
        multiDexEnabled true
    }

    // Packaging options for native libraries
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
        
        // For native libraries (.so files)
        jniLibs {
            pickFirsts += [
                'lib/armeabi-v7a/libc++_shared.so',
                'lib/arm64-v8a/libc++_shared.so',
                'lib/x86/libc++_shared.so',
                'lib/x86_64/libc++_shared.so',
                // ADDED: Fix duplicate library error for libaosl.so
                'lib/armeabi-v7a/libaosl.so',
                'lib/arm64-v8a/libaosl.so',
                'lib/x86/libaosl.so',
                'lib/x86_64/libaosl.so'
            ]
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            
            // ProGuard rules if needed
            proguardFiles(
                getDefaultProguardFile("proguard-android.txt"),
                "proguard-rules.pro"
            )
        }
        
        // Debug configuration
        debug {
            signingConfig signingConfigs.debug
        }
    }
    
    // For better build performance
    buildFeatures {
        buildConfig true
    }
}

flutter {
    source "../.."
}

// Force all modules to use the same NDK version (helps with Agora)
configurations.all {
    resolutionStrategy {
        force "com.android.ndk.thirdparty:cpp-stl:27.0.12077973"
        force "com.android.ndk.thirdparty:gnustl:27.0.12077973"
        force "com.android.ndk.thirdparty:libcxx:27.0.12077973"
    }
}

// FIX: Add namespace for agora_uikit plugin (keeping for safety even though package is removed)
subprojects {
    afterEvaluate { project ->
        if (project.name == 'agora_uikit') {
            project.android {
                namespace = "io.agora.agora_uikit"
            }
            println "✅ Fixed namespace for agora_uikit"
        }
    }
}

// Dependencies block
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // ADDED: Core library desugaring for Java 8+ features
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
    // ✅ ADD THIS: Firebase Messaging dependency for push notifications
    implementation 'com.google.firebase:firebase-messaging:23.4.0'
    
    // Add any additional app-specific dependencies here
    // But most dependencies should be in pubspec.yaml
}

name: sport_is_life
description: "SPORT IS LIFE App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Agora Video Calling
  agora_rtc_engine: 6.5.3
  agora_rtm: ^2.2.5
  http: ^1.2.0
  googleapis_auth: ^1.4.1
  # Firebase Core
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  onesignal_flutter: ^5.2.0
  
  # Google Sign In
  
  # State Management & Storage
  provider: ^6.1.2
  shared_preferences: ^2.5.4
  
  # Chat & UI
  fyrechat: ^0.0.1
  
  # Media & Recording
  image_picker: ^1.1.2
  video_player: ^2.9.2
  record: ^6.2.0
  audio_waveforms: ^2.0.2
  youtube_player_flutter: ^9.1.1
  
  # UI & Utilities
  url_launcher: ^6.3.2
  fl_chart: ^0.70.2
  intl: ^0.20.2
  
  # Notifications & Permissions - COMPATIBLE VERSIONS
  flutter_local_notifications: ^17.2.4  
  permission_handler: ^12.0.1
  timezone: ^0.9.4  
  
  # App Info & Sharing - COMPATIBLE WITH FFI 1.x (for agora_rtm)
  share_plus: ^10.1.4  
  package_info_plus: ^8.1.5  
  google_sign_in: ^6.2.1 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/videos/